security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Le compte unique du gérant (SPEC-ADMIN-01) ; aucun verrouillage
    # automatique après plusieurs échecs, cf. specs/admin.md « Ce qui n'est
    # pas défini » de SPEC-ADMIN-01 : le client n'en a pas demandé.
    providers:
        gerants:
            id: App\Infrastructure\Securite\GerantUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        gestion:
            pattern: ^/(fr|en)/gestion
            lazy: true
            provider: gerants
            form_login:
                login_path: gestion_connexion
                check_path: gestion_connexion
                default_target_path: gestion_journee
                enable_csrf: true
            logout:
                path: gestion_deconnexion
                target: /
        main:
            lazy: true
            provider: gerants

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/(fr|en)/gestion/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/(fr|en)/gestion, roles: ROLE_GERANT }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
