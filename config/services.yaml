# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Les catalogues de traduction sont une donnée d'environnement, pas
            # une constante du code : leur emplacement est injecté.
            string $dossierDesTraductions: '%kernel.project_dir%/translations'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Ni les entités ni les objets de contrat ne sont des services :
            # ce sont des données. Les politiques et les services de domaine,
            # eux, restent enregistrés.
            - '../src/Domaine/Entite/'
            - '../src/Domaine/*.php'
            - '../src/Kernel.php'

    # Le domaine définit l'interface, l'infrastructure la fournit : la
    # dépendance va bien de l'infrastructure vers le domaine (ADR-005).
    #
    # Le service porte l'identifiant de l'**interface**, et non un alias vers
    # la classe concrète : un alias serait résolu à la compilation, et les
    # cas de test ne pourraient plus y substituer l'horloge figée. `public`
    # empêche par ailleurs que le conteneur ne l'incorpore à ses appelants.
    App\Domaine\Horloge:
        class: App\Infrastructure\Horloge\HorlogeSysteme
        public: true

    # Les deux autres ports sont liés à des adaptateurs qui échouent
    # bruyamment : leur intégration réelle appartient à ADR-004 pour l'envoi et
    # à SPEC-BOOKING-07 pour le paiement. Un envoi ou un encaissement
    # silencieusement perdu serait bien plus coûteux qu'une erreur visible.
    App\Domaine\Notificateur:
        class: App\Infrastructure\Notification\NotificateurNonConfigure
        public: true

    App\Domaine\PrestataireDePaiement:
        class: App\Infrastructure\Paiement\PrestataireNonConfigure
        public: true

# Les services applicatifs ne sont utilisés que par les cas de test tant que la
# couche Interface n'existe pas : le conteneur les retirerait comme inutilisés.
# Les rendre publics **en test seulement** les garde joignables, sans relâcher
# l'encapsulation en production.
when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
            public: true
            bind:
                string $dossierDesTraductions: '%kernel.project_dir%/translations'

        App\Application\:
            resource: '../src/Application/'

        App\Infrastructure\Persistance\:
            resource: '../src/Infrastructure/Persistance/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# L'environnement `demo` sert la commande `ti-baleine:demontrer-le-parcours`, et
# rien d'autre. Les trois ports y sont liés à des adaptateurs de démonstration :
# une horloge qu'on avance, un notificateur qui n'écrit à personne, un
# prestataire qui accepte tout. **Aucun des trois ne doit être câblé ailleurs** :
# un prestataire qui répond toujours oui est exactement ce qu'un système de
# paiement ne doit pas faire.
when@demo:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
            public: true
            bind:
                string $dossierDesTraductions: '%kernel.project_dir%/translations'

        App\Application\:
            resource: '../src/Application/'

        App\Infrastructure\Persistance\:
            resource: '../src/Infrastructure/Persistance/'

        App\Infrastructure\Demonstration\:
            resource: '../src/Infrastructure/Demonstration/'

        App\Domaine\Horloge: '@App\Infrastructure\Demonstration\HorlogeReglable'
        App\Domaine\Notificateur: '@App\Infrastructure\Demonstration\NotificateurEnConsole'
        App\Domaine\PrestataireDePaiement: '@App\Infrastructure\Demonstration\PrestataireDeDemonstration'
