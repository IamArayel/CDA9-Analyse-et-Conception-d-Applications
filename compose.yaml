# Base de données de développement.
#
# Ce fichier a été produit par la recette Symfony de doctrine/doctrine-bundle,
# qui propose PostgreSQL par défaut. Il est **converti à MySQL** parce que
# ADR-002 retient MySQL 8 InnoDB, et parce que les migrations en dépendent
# réellement : la règle du naturaliste unique repose sur une colonne générée et
# un index MySQL, et les migrations emploient AUTO_INCREMENT, utf8mb4 et
# DROP FOREIGN KEY, qu'aucun autre moteur n'accepte.
#
# Les marqueurs de recette sont conservés pour que la désinstallation du bundle
# retire bien le service. Une mise à jour de recette réécrirait ce fichier :
# c'est la seule raison de le rouvrir.

services:
###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-9.3}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ti_baleine}
      # Mot de passe de développement. La production n'utilise pas ce fichier.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-!ChangeMe!}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      # Un dossier monté depuis l'hôte peut remplacer ce volume, ce qui rend
      # plus difficile de tout perdre en le supprimant par mégarde.
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
