# Catalogue français, langue par défaut du parcours (SPEC-BOOKING-11).
#
# Ce fichier étend le catalogue d'origine : les clés `parcours.*`, `gestion.*`
# et `message.*` déjà présentes sont conservées telles quelles, et le texte des
# écrans est ajouté sous `site.*`, `parcours.*`, `gestion.*` et `erreur.*`.
#
# messages.en.yaml doit porter exactement les mêmes clés : un test les compare
# une à une, pour qu'un contenu ajouté sans sa traduction fasse échouer la
# construction plutôt que d'arriver chez un client.

site:
  nom: "Ti Baleine"
  bandeau:
    lieu: "Saint-Gilles-les-Bains"
    region: "La Réunion"
    saison: "Saison 15 juin — 31 oct."
  nav:
    sorties: "Les sorties"
    bateau: "Le bateau"
    tarifs: "Tarifs"
    bon_cadeau: "Bon cadeau"
    reserver: "Réserver"
    gestion: "Espace de gestion"
  accueil:
    titre: "On regarde par en dessous."
    chapo: "Deux bateaux à fond de verre au départ de Saint-Gilles. Baleines à bosse de juin à octobre, dauphins le reste de l'année. Un naturaliste à bord, douze ou vingt-quatre places, pas une de plus."
    action_reserver: "Réserver une sortie"
    action_sorties: "Voir les sorties"
    chiffre_departs: "Trois départs par jour"
    chiffre_bateaux: "12 et 24 places"
    chiffre_seuil: "Seuil de maintien, J–24 h"
    chiffre_lieu: "Océan Indien"
  sorties:
    kicker: "Ce qu'on voit"
    titre: "Deux saisons, deux animaux"
    chapo: "Le choix n'est pas le vôtre : il est celui de la saison. Du 15 juin au 31 octobre, les baleines à bosse remontent mettre bas le long de la côte ouest. Le reste de l'année, ce sont les grands dauphins à long bec qui restent, et ils restent toute l'année."
    baleines:
      titre: "Sortie baleines à bosse"
      fenetre: "15 juin — 31 octobre"
      etat: "En saison"
      texte: "Une mère et son baleineau restent parfois vingt minutes sous le bateau. Le naturaliste raconte ce qui se passe, personne ne se met à l'eau : l'approche se fait à distance réglementaire et moteur au ralenti."
    dauphins:
      titre: "Sortie dauphins à long bec"
      fenetre: "Toute l'année"
      etat: "Hors saison aussi"
      texte: "Les groupes se croisent tout près de la barrière. Sortie plus courte, plus sûre par temps couvert, et la seule proposée quand les baleines sont reparties vers le sud."
    frise:
      titre: "Ce qui passe, et quand"
      note: "La saison des baleines ouvre le 15 juin et ferme le 31 octobre, bornes incluses. En dehors, le calendrier ne propose plus que des sorties dauphins — les horaires, eux, ne changent jamais."
  flotte:
    kicker: "Le pont"
    titre: "Le pont, et la fenêtre en dessous"
    chapo: "Les deux coques ont le même fond de verre. Le reste — la place, l'ombre, la stabilité par mer formée — change du tout au tout. C'est à cela qu'on choisit."
    longueur: "Longueur"
    capacite: "Capacité"
    privatisation: "Privatisation"
    places: "%nombre% places"
    ti_kap: "Le petit. Semi-rigide de 8 mètres, sort par mer courte, revient vite. On est douze, donc tout le monde est au premier rang du hublot."
    grand_bleu: "Le grand. Pont couvert, banquette tout autour du fond de verre, toilettes à bord. C'est lui qui part quand la houle monte, et lui qu'on privatise pour un anniversaire."
  charte:
    kicker: "La charte"
    titre: "Ce sont elles qui décident"
    chapo: "Nous respectons la charte d'approche des mammifères marins. Elle dit à quelle distance on s'arrête, combien de temps on reste, et ce qu'on ne fait jamais. Si l'animal s'éloigne, la sortie continue sans lui."
    approche:
      intitule: "Zone d'approche"
      texte: "On coupe la vitesse à trois cents mètres et on finit au ralenti, dans l'axe de déplacement de l'animal, jamais devant lui."
    distance:
      intitule: "Distance minimale"
      texte: "Moteur au point mort au-delà. Si la baleine choisit de venir plus près, c'est son affaire — nous ne réduisons pas l'écart."
    mise_a_l_eau:
      intitule: "Mise à l'eau"
      texte: "Pas de nage avec les cétacés à bord de nos bateaux. L'observation se fait du pont et du fond de verre."
    duree:
      intitule: "Temps maximal"
      texte: "Une demi-heure sur un même groupe, puis on repart. Deux bateaux jamais en approche sur le même animal."
  tarifs:
    kicker: "Les prix"
    titre: "Des prix entiers, sans étoile"
    colonne_prestation: "Prestation"
    colonne_duree: "Durée"
    colonne_adulte: "Adulte"
    colonne_enfant: "Enfant 4–12 ans"
    ligne_baleines: "Sortie baleines à bosse"
    ligne_baleines_note: "15 juin — 31 octobre · naturaliste à bord"
