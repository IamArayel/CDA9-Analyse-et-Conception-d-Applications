# Catalogue français, langue par défaut du parcours (SPEC-BOOKING-11).
#
# Les trois gabarits de message sont **provisoires** : le client n'a jamais
# fourni leur rédaction (question 15 de CR-05). Ils ne disent ici que ce que les
# spécifications établissent, sans rien inventer de plus. Le jour où le texte
# arrivera, seuls ces gabarits changeront.

parcours:
  titre: "Réserver une sortie en mer"
  creneau: "Créneau"
  adultes: "Adultes"
  enfants: "Enfants"
  avertissement_age: "Les sorties ne sont pas accessibles aux enfants de moins de 4 ans."
  risque_annulation: "Ce départ est en alerte météo : il peut être annulé."
  places_restantes: "Places restantes"
  code_promotionnel: "Bon cadeau ou avoir"
  payer: "Payer"

gestion:
  tarifs: "Tarifs"
  planning: "Planning"
  horaires: "Horaires"
  flotte: "Flotte"

message:
  rappel:
    objet: "Votre sortie en mer approche"
    corps: "Votre sortie est prévue le {date} à {heure}. Météo prévue : {prevision}."
  alerte_meteo:
    objet: "Alerte météo sur votre sortie"
    corps: "Votre sortie du {date} à {heure} est en alerte météo. La décision vous sera communiquée 2 heures avant le départ. Cet envoi ne reçoit pas de réponse ; pour nous joindre, appelez l'entreprise."
  confirmation_annulation:
    objet: "Votre sortie est annulée"
    corps: "Votre sortie du {date} à {heure} est annulée. Vous êtes remboursé de la totalité de ce que vous avez payé, sans démarche de votre part."
