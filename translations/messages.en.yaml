# English catalogue (SPEC-NFR-02).
#
# It must carry exactly the same keys as the French one: a test compares them
# key by key, so that a content added later without its translation fails the
# build rather than reaching a customer untranslated.

site:
  nom: "Ti Baleine"
  bandeau:
    lieu: "Saint-Gilles-les-Bains"
    region: "Réunion Island"
    saison: "Season 15 June — 31 Oct."
  nav:
    sorties: "The trips"
    bateau: "The boats"
    tarifs: "Prices"
    bon_cadeau: "Gift voucher"
    reserver: "Book"
    gestion: "Management area"
  accueil:
    titre: "We watch from underneath."
    chapo: "Two glass-bottomed boats leaving from Saint-Gilles. Humpback whales from June to October, dolphins the rest of the year. A naturalist on board, twelve or twenty-four seats, not one more."
    action_reserver: "Book a trip"
    action_sorties: "See the trips"
    chiffre_departs: "Three departures a day"
    chiffre_bateaux: "12 and 24 seats"
    chiffre_seuil: "Minimum to sail, 24 h before"
    chiffre_lieu: "Indian Ocean"
  sorties:
    kicker: "What you see"
    titre: "Two seasons, two animals"
    chapo: "The choice is not yours: it belongs to the season. From 15 June to 31 October, humpback whales come up the west coast to calve. The rest of the year the spinner dolphins stay on, and they stay all year."
    baleines:
      titre: "Humpback whale trip"
      fenetre: "15 June — 31 October"
      etat: "In season"
      texte: "A mother and her calf sometimes stay twenty minutes under the boat. The naturalist tells you what is happening; nobody enters the water — we approach at the regulation distance with the engine idling."
    dauphins:
      titre: "Spinner dolphin trip"
      fenetre: "All year round"
      etat: "Out of season too"
      texte: "The pods pass close to the reef. A shorter trip, safer in overcast weather, and the only one on offer once the whales have gone back south."
    frise:
      titre: "What passes, and when"
      note: "The whale season opens on 15 June and closes on 31 October, both dates included. Outside it, the calendar only offers dolphin trips — the departure times never change."
  flotte:
    kicker: "The deck"
    titre: "The deck, and the window below it"
    chapo: "Both hulls have the same glass bottom. Everything else — room, shade, steadiness in a swell — is entirely different. That is what you choose on."
    longueur: "Length"
    capacite: "Capacity"
    privatisation: "Private charter"
    places: "%nombre% seats"
    ti_kap: "The small one. An 8-metre RIB, goes out in a short sea and comes back quickly. Twelve of us, so everyone is in the front row at the window."
    grand_bleu: "The big one. Covered deck, bench seating all round the glass bottom, toilets on board. This is the one that sails when the swell picks up, and the one chartered for a birthday."
  charte:
    kicker: "The code"
    titre: "They are the ones who decide"
    chapo: "We follow the marine mammal approach code. It says how close we stop, how long we stay, and what we never do. If the animal moves off, the trip carries on without it."
    approche:
      intitule: "Approach zone"
      texte: "We cut our speed at three hundred metres and finish at idle, alongside the animal's line of travel, never in front of it."
    distance:
      intitule: "Minimum distance"
      texte: "Engine in neutral beyond this point. If the whale chooses to come closer, that is its business — we do not close the gap."
    mise_a_l_eau:
      intitule: "Entering the water"
      texte: "No swimming with cetaceans from our boats. Watching is done from the deck and through the glass bottom."
    duree:
      intitule: "Maximum time"
      texte: "Half an hour with one group, then we leave. Never two boats approaching the same animal."
  tarifs:
    kicker: "The prices"
    titre: "Whole prices, no asterisk"
    colonne_prestation: "Trip"
    colonne_duree: "Duration"
    colonne_adulte: "Adult"
    colonne_enfant: "Child 4–12"
    ligne_baleines: "Humpback whale trip"
    ligne_baleines_note: "15 June — 31 October · naturalist on board"
    ligne_dauphins: "Spinner dolphin trip"
    ligne_dauphins_note: "All year round"
    ligne_privatisation: "Private charter, %bateau%"
    ligne_privatisation_note: "Whole-boat rate, 50% deposit"
    ligne_moins_de_4: "Children under 4"
    ligne_moins_de_4_note: "Not admitted on board, on any trip"
    note_acompte_titre: "What is asked upfront"
    note_acompte: "30% when booking a trip, 50% for a charter. The rest is paid at boarding."
    note_changement_titre: "If the price changes"
    note_changement: "The amount shown when you book is the one that applies to you, even if the price list changes afterwards."
    note_code_titre: "Vouchers and credit notes"
    note_code: "One code per booking, valid for a year, not combinable. Any surplus is not refunded."
