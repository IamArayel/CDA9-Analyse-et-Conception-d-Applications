    presentation: "Whale and dolphin watching trips leaving from Saint-Gilles-les-Bains, Réunion Island."
    quai: "Quay"
    adresse: "Port de Saint-Gilles, pontoon no. 3, 97434 Saint-Gilles-les-Bains"
